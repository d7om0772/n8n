<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>KLOVA collage</title>
<style>
@font-face{font-family:Lalezar;src:url(fonts/Lalezar-Regular.ttf)}
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000}
@font-face{font-family:Rakkas;src:url(fonts/Rakkas-Regular.ttf)}
@font-face{font-family:ArefRuqaa;src:url(fonts/ArefRuqaa-Bold.ttf)}
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Abril;src:url(fonts/AbrilFatface-Regular.ttf)}
@font-face{font-family:Bungee;src:url(fonts/Bungee-Regular.ttf)}
@font-face{font-family:Marker;src:url(fonts/PermanentMarker-Regular.ttf)}
@font-face{font-family:Shrikhand;src:url(fonts/Shrikhand-Regular.ttf)}
@font-face{font-family:Marhey;src:url(fonts/Marhey.ttf);font-weight:300 700}
@font-face{font-family:ReemKufi;src:url(fonts/ReemKufi.ttf);font-weight:400 700}
@font-face{font-family:Blaka;src:url(fonts/Blaka-Regular.ttf)}
@font-face{font-family:Lemonada;src:url(fonts/Lemonada.ttf);font-weight:300 700}
@font-face{font-family:Elite;src:url(fonts/SpecialElite-Regular.ttf)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#D2AE82}
#cam,#shake{position:absolute;inset:0}
.scene{position:absolute;left:-60px;top:-60px;width:1200px;height:2040px;visibility:hidden}
.fringe{position:absolute;inset:0;background:#FBF6EC}
.sheet{position:absolute;inset:12px;overflow:hidden}
.pat{position:absolute;inset:0}
.tex{position:absolute;inset:0;background-image:var(--tex);background-size:600px 600px;mix-blend-mode:multiply;opacity:.6}
.content{position:absolute;left:60px;top:60px;width:1080px;height:1920px}
.abs{position:absolute}
.row{position:absolute;display:flex;flex-direction:row;direction:rtl;align-items:center;justify-content:center;white-space:nowrap}
.bw{display:inline-block;filter:drop-shadow(7px 9px 0 rgba(0,0,0,.30))}
.blk{padding:.0em .3em .1em;line-height:1.38;white-space:nowrap;direction:rtl;text-align:center}
.lat{direction:ltr;line-height:1.05;padding:.12em .22em .08em}
.stk img{width:100%;height:100%;display:block}
.big{white-space:nowrap;direction:rtl;line-height:1.2;text-align:center}
.tape{position:absolute;width:190px;height:56px;background:rgba(255,246,214,.78);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.16}
#grain div{position:absolute;inset:0;background-size:540px 960px;image-rendering:pixelated;visibility:hidden}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.28) 100%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.card{position:absolute;width:212px;background:#fff;padding:14px 14px 6px;box-sizing:border-box;filter:drop-shadow(6px 9px 0 rgba(0,0,0,.25))}
.card img{width:184px;height:138px;display:block;object-fit:cover;box-shadow:0 0 0 3px #2B1A12}
.card div{font-family:Cairo;font-weight:900;font-size:34px;color:#2B1A12;text-align:center;line-height:1.5;direction:rtl}
.receipt{position:absolute;left:250px;top:392px;width:580px;height:0;background:#FFFDF7;overflow:hidden;box-sizing:border-box;filter:drop-shadow(8px 10px 0 rgba(0,0,0,.35))}
.receipt .in{padding:26px 40px;direction:rtl;font-family:Cairo;font-weight:700;font-size:40px;color:#2B1A12}
.receipt .ln{display:flex;justify-content:space-between;line-height:1.6}
.receipt .ln span:nth-child(2){font-family:Cairo;font-weight:900}
.receipt .hr{border-top:5px dashed #2B1A12;margin:14px 0;opacity:.7}
.btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:22px;direction:rtl;background:#FF5A36;border:7px solid #2B1A12;border-radius:100px;box-shadow:0 14px 0 #2B1A12;padding:6px 60px 14px;font-family:Lalezar;font-size:112px;color:#FFF6E8;white-space:nowrap}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <filter id="stk" x="-25%" y="-25%" width="150%" height="150%">
   <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="d"/>
   <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="o"/>
   <feOffset in="d" dx="10" dy="14" result="so"/><feFlood flood-color="#000" flood-opacity=".28"/><feComposite in2="so" operator="in" result="sh"/>
   <feMerge><feMergeNode in="sh"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="stkS" x="-25%" y="-25%" width="150%" height="150%">
   <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="d"/>
   <feFlood flood-color="#ffffff"/><feComposite in2="d" operator="in" result="o"/>
   <feOffset in="d" dx="6" dy="9" result="so"/><feFlood flood-color="#000" flood-opacity=".28"/><feComposite in2="so" operator="in" result="sh"/>
   <feMerge><feMergeNode in="sh"/><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
</svg>
<div id="stage">
 <div id="cam"><div id="shake"></div></div>
 <div id="grain"></div>
 <div id="vig"></div>
 <div id="flash"></div>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
<script src="words.js"></script>
<script src="main.js"></script>
</body>
</html>
