<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Digital Cards Motion</title>
<style>
  html, body { margin: 0; background: #EDE3CD; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #F4ECDB 0%, #ECE1C9 70%, #E6D9BE 100%);
    perspective: 5200px; perspective-origin: 540px 120px;
  }
  #stage::before { content: ""; position: absolute; inset: 0; background: url(../build/noise.png); opacity: .35; mix-blend-mode: multiply; }
  .sheet { position: absolute; left: 44px; width: 992px; height: 1730px; border-radius: 16px; background: #F6F0E2;
           box-shadow: 0 2px 0 #E2D6BC, 0 10px 26px rgba(96, 74, 34, .16); }
  .page { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
          transform-origin: 540px 186px; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; isolation: isolate; }
  .back { transform-origin: 540px 1015px; transform: rotateX(180deg); }
  .paper { position: absolute; left: 44px; top: 150px; width: 992px; height: 1730px; border-radius: 16px;
           background-color: #FDFAF2; overflow: hidden; box-shadow: 0 1px 0 #E6DCC6, 0 4px 10px rgba(96, 74, 34, .10); }
  .paper::after { content: ""; position: absolute; inset: 0; background: url(../build/noise.png); opacity: .22; mix-blend-mode: multiply; }
  .lines { position: absolute; left: 0; right: 0; top: 118px; bottom: 34px; }
  .ruled .lines { background: repeating-linear-gradient(to bottom, transparent 0 66px, #E2D6BD 66px 68.5px); }
  .grid .lines { left: 26px; right: 26px; background-image:
       linear-gradient(#EBE1CC 1.6px, transparent 1.6px), linear-gradient(90deg, #EBE1CC 1.6px, transparent 1.6px);
       background-size: 52px 52px; }
  .margin { position: absolute; top: 0; bottom: 0; right: 104px; width: 3px; background: #F1CF60; opacity: .9; }
  .grid .margin { display: none; }
  .hole { position: absolute; top: 25px; width: 22px; height: 22px; border-radius: 50%;
          background: #E4D7BB; box-shadow: inset 0 3px 4px rgba(70, 52, 20, .35); }
  .backside { background-color: #F3ECDC; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; overflow: visible; }
  .mb { mix-blend-mode: multiply; }
  .ink { position: absolute; mix-blend-mode: multiply; overflow: visible; }
  .cast, .lift { position: absolute; left: 44px; top: 150px; width: 992px; border-radius: 16px; opacity: 0; pointer-events: none; }
  .cast { background: linear-gradient(to bottom, rgba(70, 52, 22, .05), rgba(70, 52, 22, .20) 88%, rgba(70, 52, 22, 0)); }
  .lift { height: 1730px; background: linear-gradient(to bottom, rgba(255, 255, 255, .0), rgba(255, 252, 240, .55)); }
  .sticky { position: absolute; border-radius: 4px 4px 10px 4px;
            background: linear-gradient(160deg, #FBE38A 0%, #F7D560 70%, #F2CB4E 100%);
            box-shadow: 0 8px 14px rgba(110, 80, 20, .18), 0 1px 0 rgba(0, 0, 0, .05); }
  .sticky::before { content: ""; position: absolute; left: 50%; top: -16px; width: 110px; height: 32px; margin-left: -55px;
            background: rgba(232, 218, 188, .78); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  #rings { position: absolute; left: 0; top: 0; z-index: 90; }
  #pencil { position: absolute; left: 0; top: 0; z-index: 100; overflow: visible;
            filter: drop-shadow(10px 16px 6px rgba(80, 60, 25, .22)); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../build/strokes.js"></script>
<script src="anim.js"></script>
</body>
</html>
