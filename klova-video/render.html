<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Taj';font-weight:900;src:url(fonts/tajawal-arabic-900.ttf);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F;}
@font-face{font-family:'Taj';font-weight:900;src:url(fonts/tajawal-latin-900.ttf);unicode-range:U+0000-00FF,U+2000-206F;}
@font-face{font-family:'Taj';font-weight:700;src:url(fonts/tajawal-arabic-700.ttf);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F;}
@font-face{font-family:'Taj';font-weight:700;src:url(fonts/tajawal-latin-700.ttf);unicode-range:U+0000-00FF,U+2000-206F;}
@font-face{font-family:'Taj';font-weight:500;src:url(fonts/tajawal-arabic-500.ttf);unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F;}
@font-face{font-family:'Taj';font-weight:500;src:url(fonts/tajawal-latin-500.ttf);unicode-range:U+0000-00FF,U+2000-206F;}
html,body{margin:0;padding:0;background:#1C120C;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = 1080, H = 1920;

// ---------- palette (one palette for every shot) ----------
const P = {
  esp: '#1C120C', dark: '#2A1A11', brown: '#5B3824', mocha: '#8A5A3B',
  caramel: '#C98A4B', latte: '#E3C6A0', cream: '#F5EBDD', paper: '#F3E6D2',
  accent: '#E0662E', cherry: '#B83A2A', cherry2: '#D0532C', leaf: '#6B7443', leafD: '#4E5630',
  green: '#AFA868'
};
const BG_A = '#F3E6D2', BG_B = '#E3C6A0';

// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOutCubic = t => 1 - Math.pow(1 - t, 3);
const eInCubic = t => t * t * t;
const eInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eOutBack = (t, s = 1.9) => { const c = s + 1; return 1 + c * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
const eOutQuint = t => 1 - Math.pow(1 - t, 5);
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], clamp(t)))).join(',')})`; }
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TAU = Math.PI * 2;

// ---------- grid ----------
const M = 28, G = 10;
const CW = (W - 2 * M - G) / 2, CH = (H - 2 * M - 2 * G) / 3;
const cells = [];
for (let i = 0; i < 6; i++) {
  const row = Math.floor(i / 2), right = i % 2 === 0;
  cells.push({ x: right ? M + CW + G : M, y: M + row * (CH + G), w: CW, h: CH });
}
const FILL = [3.32, 4.36, 5.26, 7.66, 9.08, 10.44];
const CELL_BG = [BG_A, BG_B, BG_B, BG_A, BG_A, BG_B];
const EXP0 = 16.78, EXP1 = 17.55; // hero expansion
const END = 20.8;

// ---------- drawing primitives ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

function bean(c, x, y, r, rot, col, creaseCol, hl = 0.22) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.ellipse(0, 0, r * 0.74, r, 0, 0, TAU);
  const g = c.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r * 1.1);
  g.addColorStop(0, mix(col, '#ffffff', 0.18)); g.addColorStop(1, col);
  c.fillStyle = g; c.fill();
  c.beginPath(); c.moveTo(0, -r * 0.86);
  c.bezierCurveTo(r * 0.36, -r * 0.3, -r * 0.36, r * 0.3, 0, r * 0.86);
  c.lineWidth = r * 0.16; c.lineCap = 'round'; c.strokeStyle = creaseCol; c.stroke();
  c.beginPath(); c.ellipse(-r * 0.32, -r * 0.42, r * 0.14, r * 0.26, 0.4, 0, TAU);
  c.fillStyle = `rgba(255,255,255,${hl})`; c.fill();
  c.restore();
}

function cherry(c, x, y, r, col) {
  c.save();
  c.beginPath(); c.arc(x + r * 0.12, y + r * 0.16, r, 0, TAU); c.fillStyle = 'rgba(42,26,17,0.18)'; c.fill();
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r * 1.05);
  g.addColorStop(0, mix(col, '#ffffff', 0.3)); g.addColorStop(0.55, col); g.addColorStop(1, mix(col, '#1C120C', 0.35));
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = g; c.fill();
  c.beginPath(); c.ellipse(x - r * 0.38, y - r * 0.42, r * 0.22, r * 0.14, -0.6, 0, TAU); c.fillStyle = 'rgba(255,255,255,0.45)'; c.fill();
  c.beginPath(); c.arc(x + r * 0.05, y + r * 0.62, r * 0.1, 0, TAU); c.fillStyle = 'rgba(28,18,12,0.45)'; c.fill();
  c.restore();
}

function leaf(c, x, y, len, ang, col, vein) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.beginPath(); c.moveTo(0, 0);
  c.bezierCurveTo(len * 0.3, -len * 0.32, len * 0.75, -len * 0.26, len, 0);
  c.bezierCurveTo(len * 0.75, len * 0.26, len * 0.3, len * 0.32, 0, 0);
  c.fillStyle = 'rgba(42,26,17,0.16)'; c.save(); c.translate(3, 5); c.fill(); c.restore();
  const g = c.createLinearGradient(0, -len * 0.3, 0, len * 0.3); g.addColorStop(0, mix(col, '#ffffff', 0.15)); g.addColorStop(1, col);
  c.fillStyle = g; c.fill();
  c.beginPath(); c.moveTo(len * 0.05, 0); c.quadraticCurveTo(len * 0.5, -len * 0.03, len * 0.95, 0);
  c.strokeStyle = vein; c.lineWidth = Math.max(1.5, len * 0.03); c.stroke();
  for (let k = 1; k <= 3; k++) {
    const px = len * (0.2 + k * 0.18);
    c.beginPath(); c.moveTo(px, -len * 0.01); c.lineTo(px + len * 0.1, -len * 0.14); c.moveTo(px, len * 0.01); c.lineTo(px + len * 0.1, len * 0.14); c.stroke();
  }
  c.restore();
}

function dots(c, w, h, col, a, step = 26, r = 2.2) {
  c.save(); c.fillStyle = rgba(col, a);
  for (let y = step / 2; y < h; y += step) for (let x = ((y / step) % 2 ? step : step / 2); x < w; x += step) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
  c.restore();
}

function steam(c, x, y, hgt, t, a, lw) {
  c.save(); c.lineCap = 'round'; c.lineWidth = lw;
  for (let k = 0; k < 3; k++) {
    const ph = t * 1.2 + k * 0.33; const f = ph % 1;
    const alpha = a * Math.sin(f * Math.PI);
    c.strokeStyle = `rgba(255,250,240,${alpha})`;
    const ox = x + (k - 1) * lw * 3.2;
    c.beginPath();
    for (let s = 0; s <= 20; s++) {
      const u = s / 20; const yy = y - f * hgt * 0.35 - u * hgt * 0.65;
      const xx = ox + Math.sin(u * 5 + t * 3 + k) * lw * 1.6 * (0.4 + u);
      s ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
  }
  c.restore();
}

// ---------- text helpers (RTL word layout) ----------
function font(sz, wt = 900) { return `${wt} ${sz}px Taj`; }
function measureWords(words, sz, wt = 900) {
  ctx.font = font(sz, wt);
  const sp = ctx.measureText(' ').width;
  return { ws: words.map(w => ctx.measureText(w).width), sp };
}
// layout a list of words into lines that fit maxW. returns lines of {i, w}
function layoutLines(words, sz, maxW, wt = 900) {
  const { ws, sp } = measureWords(words, sz, wt);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  if (total <= maxW || words.length < 2) return { lines: [words.map((_, i) => i)], ws, sp };
  let best = null;
  for (let k = 1; k < words.length; k++) {
    const w1 = ws.slice(0, k).reduce((a, b) => a + b, 0) + sp * (k - 1);
    const w2 = ws.slice(k).reduce((a, b) => a + b, 0) + sp * (words.length - k - 1);
    const m = Math.max(w1, w2);
    if (!best || m < best.m) best = { k, m };
  }
  return { lines: [[...Array(best.k).keys()], [...Array(words.length - best.k).keys()].map(i => i + best.k)], ws, sp };
}

// ---------- CAPTIONS (from SRT) ----------
const PHRASES = [
  { t0: 3.32, words: [['حنا', 3.32], ['كلوفا', 3.66, 'hl']] },
  { t0: 4.36, words: [['متجر', 4.36], ['متخصص', 4.66], ['في', 5.14], ['محاصيل', 5.26, 'hl'], ['القهوة', 5.62, 'hl']], br: 3 },
  { t0: 6.32, words: [['والفرق', 6.32], ['غالباً', 6.80], ['مو', 7.36], ['في', 7.54], ['المكينة', 7.66, 'hl']] },
  { t0: 8.42, words: [['الفرق', 8.42], ['في', 8.92], ['المحصول', 9.08, 'hl'], ['نفسه', 9.70]] },
  { t0: 10.44, words: [['عشان', 10.44], ['كذا', 10.66], ['نوفر', 10.82], ['لك', 11.20]] },
  { t0: 11.34, words: [['محاصيل', 11.34], ['من', 11.80], ['أكثر', 12.02, 'hl'], ['من', 12.46, 'hl'], ['بلد', 12.60, 'hl']] },
  { t0: 13.18, words: [['كل', 13.18], ['واحد', 13.40], ['له', 13.76], ['طعمه', 13.96, 'hl']] },
  { t0: 14.60, words: [['بدون', 14.60], ['ما', 14.90], ['تدفع', 15.00], ['كل', 15.36], ['يوم', 15.60], ['في', 15.86], ['الكوفيّات', 15.98, 'strike']], br: 3 },
  { t0: 16.78, words: [['وبدون', 16.78], ['ما', 17.22], ['تتنازل', 17.34], ['عن', 18.02], ['الطعم', 18.18, 'hl']] },
  { t0: 18.80, words: [['اختار', 18.80], ['محصولك', 19.08, 'hl']], big: true },
];
const BAR_Y = 652;
function manualLines(p, sz) {
  const { ws, sp } = measureWords(p.words.map(w => w[0]), sz);
  const n = p.words.length;
  return { lines: [[...Array(p.br).keys()], [...Array(n - p.br).keys()].map(i => i + p.br)], ws, sp };
}
function phraseMetrics(p) {
  const sz = p.big ? 84 : 66;
  const L = p.br ? manualLines(p, sz) : layoutLines(p.words.map(w => w[0]), sz, 880);
  const lineW = L.lines.map(l => l.reduce((a, i) => a + L.ws[i], 0) + L.sp * (l.length - 1));
  const lh = sz * 1.28;
  return { sz, L, lineW, lh, bw: Math.max(...lineW) + 84, bh: lh * L.lines.length + 34 };
}
PHRASES.forEach(p => { p.m = null; });

function tape(c, x, y, w, h, ang) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = 'rgba(227,198,160,0.88)'; c.fillRect(-w / 2, -h / 2, w, h);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(-w / 2, -h / 2, w, h * 0.35);
  c.restore();
}

function drawWordRTL(c, word, xRight, yMid, sz, color, p, wt = 900) {
  // p: 0..1 pop progress
  if (p <= 0) return;
  c.save();
  c.font = font(sz, wt);
  const w = c.measureText(word).width;
  const s = eOutBack(clamp(p), 2.2);
  c.translate(xRight - w / 2, yMid);
  c.scale(Math.max(0.001, s), Math.max(0.001, s));
  c.globalAlpha *= clamp(p * 3);
  c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(word, 0, sz * 0.06);
  c.restore();
}

function drawCaption(t) {
  if (t < PHRASES[0].t0 - 0.02) return;
  let idx = 0; for (let i = 0; i < PHRASES.length; i++) if (t >= PHRASES[i].t0 - 0.02) idx = i;
  const p = PHRASES[idx]; if (!p.m) p.m = phraseMetrics(p);
  const prev = idx > 0 ? PHRASES[idx - 1] : null; if (prev && !prev.m) prev.m = phraseMetrics(prev);
  const k = eOutCubic(seg(t, p.t0 - 0.02, p.t0 + 0.16));
  const bw = prev ? lerp(prev.m.bw, p.m.bw, k) : p.m.bw;
  const bh = prev ? lerp(prev.m.bh, p.m.bh, k) : p.m.bh;
  const appear = idx === 0 ? eOutBack(seg(t, p.t0 - 0.02, p.t0 + 0.3), 1.6) : 1;
  const bump = 1 + 0.035 * Math.exp(-Math.max(0, t - p.t0) * 14) * (idx > 0 ? 1 : 0);
  ctx.save();
  ctx.translate(W / 2, BAR_Y - 92 * eInOutCubic(seg(t, 18.72, 19.0)));
  ctx.scale(appear * bump, appear * bump);
  // hard shadow + bar
  rr(ctx, -bw / 2 + 0, -bh / 2 + 9, bw, bh, 20); ctx.fillStyle = 'rgba(28,18,12,0.55)'; ctx.fill();
  rr(ctx, -bw / 2, -bh / 2, bw, bh, 20); ctx.fillStyle = P.cream; ctx.fill();
  tape(ctx, bw / 2 - 16, -bh / 2 + 4, 86, 30, 0.5);
  tape(ctx, -bw / 2 + 16, bh / 2 - 4, 86, 30, 0.5);
  // words
  const m = p.m; const nL = m.L.lines.length;
  m.L.lines.forEach((line, li) => {
    const y = -((nL - 1) * m.lh) / 2 + li * m.lh;
    let xr = m.lineW[li] / 2;
    line.forEach(wi => {
      const [word, ts, fx] = p.words[wi];
      const ww = m.L.ws[wi];
      const pop = seg(t, ts - 0.05, ts + 0.2);
      if (fx === 'hl') {
        const mk = eOutCubic(seg(t, ts + 0.02, ts + 0.2));
        if (mk > 0) {
          const pw = ww + 22;
          rr(ctx, xr + 11 - pw * mk, y - m.sz * 0.58, pw * mk, m.sz * 1.16, 12);
          ctx.fillStyle = P.accent; ctx.fill();
        }
        drawWordRTL(ctx, word, xr, y, m.sz, mk > 0.5 ? P.cream : P.dark, pop);
      } else if (fx === 'strike') {
        drawWordRTL(ctx, word, xr, y, m.sz, P.mocha, pop);
        const sk = eOutCubic(seg(t, ts + 0.16, ts + 0.38));
        if (sk > 0) {
          ctx.save(); ctx.strokeStyle = P.accent; ctx.lineWidth = 9; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(xr + 6, y + 4); ctx.lineTo(xr + 6 - (ww + 12) * sk, y + 4 - 10 * sk); ctx.stroke(); ctx.restore();
        }
      } else {
        drawWordRTL(ctx, word, xr, y, m.sz, P.dark, pop);
      }
      xr -= ww + m.L.sp;
    });
  });
  ctx.restore();
}

// ---------- HOOK (0 - 3.3s) ----------
function drawHook(t) {
  if (t > 3.36) return;
  const out = eInCubic(seg(t, 3.0, 3.3));
  ctx.save();
  ctx.translate(W / 2, 960);
  ctx.scale(1 - 0.25 * out, 1 - 0.25 * out);
  ctx.translate(0, -120 * out);
  ctx.globalAlpha = 1 - out;
  const sz = 132;
  const lines = [[['إذا', 0.02], ['تسوي', 0.44], ['قهوتك', 0.78, 'hl']], [['في', 1.2], ['البيت؟', 1.3]]];
  lines.forEach((line, li) => {
    const { ws, sp } = measureWords(line.map(w => w[0]), sz);
    const tot = ws.reduce((a, b) => a + b, 0) + sp * (line.length - 1);
    let xr = tot / 2; const y = -150 + li * 165;
    line.forEach(([word, ts, fx], wi) => {
      const pop = seg(t, ts - 0.04, ts + 0.22);
      ctx.save(); ctx.globalAlpha *= 0.55; drawWordRTL(ctx, word, xr, y + 10, sz, P.esp, pop); ctx.restore();
      drawWordRTL(ctx, word, xr, y, sz, fx === 'hl' ? P.accent : P.cream, pop);
      if (fx === 'hl') {
        const u = eOutCubic(seg(t, ts + 0.12, ts + 0.42));
        if (u > 0) { ctx.save(); ctx.strokeStyle = P.accent; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath();
          const x0 = xr, x1 = xr - ws[wi] * u; ctx.moveTo(x0, y + 82); ctx.quadraticCurveTo((x0 + x1) / 2, y + 96, x1, y + 80); ctx.stroke(); ctx.restore(); }
      }
      xr -= ws[wi] + sp;
    });
  });
  // tag "هذا الفيديو لك"
  const tp = seg(t, 1.84, 2.18);
  if (tp > 0) {
    const tw = [['هذا', 1.88], ['الفيديو', 2.18], ['لك', 2.68]];
    const tsz = 76;
    const { ws, sp } = measureWords(tw.map(w => w[0]), tsz);
    const tot = ws.reduce((a, b) => a + b, 0) + sp * 2;
    const bw = tot + 80, bh = 118;
    const lk = Math.exp(-Math.max(0, t - 2.68) * 9) * (t > 2.68 ? 1 : 0);
    ctx.save(); ctx.translate(0, 210); ctx.rotate(-0.06 + 0.03 * Math.sin(lk * 6));
    const s = eOutBack(tp, 2.4) * (1 + 0.08 * lk);
    ctx.scale(s, s);
    rr(ctx, -bw / 2, -bh / 2 + 10, bw, bh, 26); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    rr(ctx, -bw / 2, -bh / 2, bw, bh, 26); ctx.fillStyle = P.accent; ctx.fill();
    let xr = tot / 2;
    tw.forEach(([word, ts], wi) => { drawWordRTL(ctx, word, xr, 0, tsz, P.cream, seg(t, ts - 0.04, ts + 0.2)); xr -= ws[wi] + sp; });
    ctx.restore();
  }
  ctx.restore();
}

// ---------- empty cells ----------
function nextEmpty(t) { for (let i = 0; i < 6; i++) if (t < FILL[i]) return i; return -1; }
function drawEmpty(i, t) {
  const c = cells[i];
  const d = seg(t, 0.03 + i * 0.07, 0.42 + i * 0.07);
  if (d <= 0) return;
  ctx.save();
  const L = 2 * (c.w + c.h);
  const nx = nextEmpty(t);
  const isNext = nx === i && t > 3.1;
  const pulse = 0.5 + 0.5 * Math.sin(t * TAU * 2.2);
  ctx.lineWidth = isNext ? 4 : 2.5;
  ctx.strokeStyle = isNext ? rgba(P.accent, 0.55 + 0.45 * pulse) : rgba(P.caramel, 0.75);
  ctx.setLineDash([L * eOutCubic(d), L]);
  rr(ctx, c.x + 1, c.y + 1, c.w - 2, c.h - 2, 18); ctx.stroke();
  ctx.setLineDash([]);
  // corner number
  ctx.globalAlpha = eOutCubic(seg(t, 0.25 + i * 0.07, 0.6 + i * 0.07));
  ctx.font = font(30, 700); ctx.fillStyle = rgba(P.caramel, 0.8); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('0' + (i + 1), c.x + c.w - 24, c.y + 22);
  // center glyph after the hook
  const g = eOutBack(seg(t, 3.1 + i * 0.05, 3.45 + i * 0.05));
  if (g > 0) {
    const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
    ctx.save(); ctx.translate(cx, cy);
    if (i === 5) {
      const s = g * (1 + 0.06 * Math.sin(t * TAU * 1.6));
      ctx.scale(s, s);
      ctx.font = font(170, 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = rgba(P.accent, isNext ? 0.75 + 0.25 * pulse : 0.55); ctx.fillText('؟', 0, 10);
    } else {
      const s = g * (isNext ? 1 + 0.18 * pulse : 0.85);
      ctx.scale(s, s);
      ctx.strokeStyle = isNext ? rgba(P.accent, 0.9) : rgba(P.caramel, 0.55); ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(26, 0); ctx.moveTo(0, -26); ctx.lineTo(0, 26); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

// ================= SCENES (each draws inside a clipped cell, 0,0,w,h) =================
// C1 : brand badge with orbiting beans
function sceneLogo(c, lt, w, h) {
  const u = w / 507; const cx = w / 2, cy = h * 0.47;
  dots(c, w, h, P.caramel, 0.18, 30 * u, 2.4 * u);
  const s0 = eOutBack(seg(lt, 0.05, 0.5), 2);
  // rotating dashed ring
  c.save(); c.translate(cx, cy); c.rotate(lt * 0.35);
  c.setLineDash([14 * u, 12 * u]); c.lineWidth = 4 * u; c.strokeStyle = rgba(P.caramel, 0.9);
  c.beginPath(); c.arc(0, 0, 214 * u * s0, 0, TAU); c.stroke(); c.restore();
  // orbiting beans
  for (let k = 0; k < 10; k++) {
    const a = k / 10 * TAU + lt * 0.55;

  c.strokeStyle = sg; c.lineWidth = 7; c.stroke();
  // ripples on bed
  for (let k = 0; k < 2; k++) { const f = (lt * 1.4 + k * 0.5) % 1; c.beginPath(); c.ellipse(cx + Math.cos(orbit) * 40, 1003, 20 + f * 60, (20 + f * 60) * 0.14, 0, 0, TAU); c.strokeStyle = `rgba(255,240,220,${0.6 * (1 - f)})`; c.lineWidth = 3; c.stroke(); }
  c.globalAlpha = ga0; c.translate(lift * 460, -lift * 360); c.translate(tipX, tipY); c.rotate(-lift * 0.3); c.translate(-tipX, -tipY);
  // spout
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(tipX, tipY); c.quadraticCurveTo(tipX + 20, tipY - 34, tipX + 60, tipY - 24); c.bezierCurveTo(tipX + 110, tipY - 10, tipX + 120, tipY + 70, tipX + 200, tipY + 48);
  c.strokeStyle = P.esp; c.lineWidth = 24; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,0.18)'; c.lineWidth = 6; c.stroke();
  // body
  const kx = tipX + 330, ky = tipY + 10;
  c.translate(kx, ky); c.rotate(-0.12 + Math.sin(orbit) * 0.02);
  c.beginPath(); c.moveTo(-150, 120); c.lineTo(-120, -110); c.quadraticCurveTo(0, -150, 120, -110); c.lineTo(150, 120); c.quadraticCurveTo(0, 150, -150, 120); c.closePath();
  c.fillStyle = 'rgba(28,18,12,0.2)'; c.save(); c.translate(12, 14); c.fill(); c.restore();
  const kg2 = c.createLinearGradient(-150, 0, 150, 0); kg2.addColorStop(0, '#3A261A'); kg2.addColorStop(0.35, '#2A1A11'); kg2.addColorStop(1, '#140C08');
  c.fillStyle = kg2; c.fill();
  c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(-110, -60, 26, 150);
  rr(c, -150, 100, 300, 26, 12); c.fillStyle = P.caramel; c.fill();
  c.beginPath(); c.ellipse(0, -128, 70, 16, 0, 0, TAU); c.fillStyle = '#3A261A'; c.fill();
  c.beginPath(); c.arc(0, -150, 18, 0, TAU); c.fillStyle = P.caramel; c.fill();
  c.restore();
  // mug with steam
  c.save();
  const mx = 930;
  c.fillStyle = 'rgba(28,18,12,0.22)'; c.beginPath(); c.ellipse(mx + 10, 1452, 90, 12, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(mx - 72, 1330); c.lineTo(mx + 72, 1330); c.lineTo(mx + 62, 1450); c.lineTo(mx - 62, 1450); c.closePath(); c.fillStyle = P.cream; c.fill();
  c.beginPath(); c.arc(mx - 80, 1385, 26, Math.PI * 0.5, Math.PI * 1.5); c.strokeStyle = P.cream; c.lineWidth = 14; c.stroke();
  c.beginPath(); c.ellipse(mx, 1332, 70, 12, 0, 0, TAU); c.fillStyle = '#4A2C1B'; c.fill();
  rr(c, mx - 67, 1380, 134, 18, 4); c.fillStyle = P.accent; c.fill();
  steam(c, mx, 1310, 170, lt, 0.85, 9);
  c.restore();
  steam(c, cx, 960, 160, lt + 0.4, 0.55 + 0.3 * lift, 8);
  c.restore();
}

const SCENES = [sceneLogo, scenePour, sceneBranch, sceneMachine, sceneSplit, sceneHero];

// ---------- chips (origins then taste notes) ----------
const ORIG = ['إثيوبيا', 'كولومبيا', 'البرازيل', 'اليمن', 'كينيا', 'غواتيمالا'];
const NOTE = ['زهري', 'كراميل', 'شوكولاتة', 'توابل', 'حمضيات', 'مكسرات'];
function drawChips(t) {
  if (t < 11.3 || t > 15.0) return;
  for (let i = 0; i < 6; i++) {
    const c = cells[i];
    const tin = 11.40 + i * 0.22, tf = 13.18 + i * 0.2, tout = 14.60 + i * 0.04;
    const pin = eOutBack(seg(t, tin, tin + 0.3), 2.2);
    const pout = eInCubic(seg(t, tout, tout + 0.2));
    const s = pin * (1 - pout);
    if (s <= 0) continue;
    const flipP = seg(t, tf, tf + 0.2);
    const isNote = flipP >= 0.5;
    const sy = Math.abs(Math.cos(flipP * Math.PI));
    const label = isNote ? NOTE[i] : ORIG[i];
    ctx.save();
    ctx.font = font(42);
    const tw = ctx.measureText(label).width;
    const bw = tw + 84, bh = 70;
    ctx.translate(c.x + c.w / 2, c.y + c.h * 0.19);
    ctx.rotate((i % 2 ? 1 : -1) * 0.04);
    ctx.scale(s, s * Math.max(0.02, sy));
    rr(ctx, -bw / 2, -bh / 2 + 7, bw, bh, 35); ctx.fillStyle = 'rgba(28,18,12,0.45)'; ctx.fill();
    rr(ctx, -bw / 2, -bh / 2, bw, bh, 35); ctx.fillStyle = isNote ? P.accent : P.dark; ctx.fill();
    ctx.beginPath(); ctx.arc(bw / 2 - 30, 0, 9, 0, TAU); ctx.fillStyle = isNote ? P.cream : P.accent; ctx.fill();
    ctx.fillStyle = P.cream; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, -12, 3);
    ctx.restore();
  }
}

// ---------- coins burst (تدفع) ----------
const COINS = (() => { const r = mulberry(99); return Array.from({ length: 7 }, (_, i) => ({ vx: (r() - 0.5) * 900, vy: -700 - r() * 500, spin: 8 + r() * 10, d: r() * 0.08 })); })();
function drawCoins(t) {
  const t0 = 15.0;
  if (t < t0 || t > t0 + 1.4) return;
  COINS.forEach(cn => {
    const tt = t - t0 - cn.d; if (tt < 0) return;
    const x = W / 2 + cn.vx * tt, y = BAR_Y - 20 + cn.vy * tt + 0.5 * 2600 * tt * tt;
    const a = 1 - seg(tt, 0.9, 1.25);
    const sx = Math.abs(Math.cos(tt * cn.spin));
    ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(0.08, sx), 1); ctx.globalAlpha = a;
    ctx.beginPath(); ctx.arc(5, 7, 46, 0, TAU); ctx.fillStyle = 'rgba(28,18,12,0.4)'; ctx.fill();
    const g = ctx.createRadialGradient(-12, -14, 4, 0, 0, 48); g.addColorStop(0, '#F3C98F'); g.addColorStop(1, P.caramel);
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, TAU); ctx.fillStyle = g; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.strokeStyle = rgba(P.brown, 0.6); ctx.lineWidth = 4; ctx.stroke();
    bean(ctx, 0, 0, 16, 0.4, P.brown, P.dark, 0.1);
    ctx.restore();
  });
}

// ---------- final CTA ----------
function drawCTA(t) {
  if (t < 18.76) return;
  // logo sticker
  const lp = eOutBack(seg(t, 18.8, 19.15), 2);
  if (lp > 0) {
    ctx.save(); ctx.translate(W / 2, 262); ctx.rotate(-0.03); ctx.scale(lp, lp);
    rr(ctx, -210, -92 + 10, 420, 184, 34); ctx.fillStyle = 'rgba(28,18,12,0.5)'; ctx.fill();
    rr(ctx, -210, -92, 420, 184, 34); ctx.fillStyle = P.dark; ctx.fill();
    ctx.font = font(110); ctx.fillStyle = P.cream; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('كلوفا', 24, -10);
    bean(ctx, -150, -12, 30, 0.5, P.caramel, P.brown, 0.12);
    ctx.font = font(30, 700); ctx.fillStyle = P.caramel; ctx.fillText('متجر محاصيل القهوة', 0, 58);
    ctx.restore();
  }
  // button
  const words = [['من', 19.52], ['الرابط', 19.64], ['بالبايو', 20.02]];
  const bp = eOutBack(seg(t, 19.48, 19.8), 2.2);
  if (bp > 0) {
    const sz = 64;
    const { ws, sp } = measureWords(words.map(w => w[0]), sz);
    const tot = ws.reduce((a, b) => a + b, 0) + sp * 2;
    const bw = tot + 170, bh = 116;
    const pulse = 1 + 0.035 * Math.sin((t - 19.8) * TAU * 2.4) * seg(t, 19.8, 20.0);
    ctx.save(); ctx.translate(W / 2, 722); ctx.scale(bp * pulse, bp * pulse);
    // tap ripple
    const rp = seg(t, 20.05, 20.6);
    if (rp > 0 && rp < 1) { rr(ctx, -bw / 2 - 40 * rp, -bh / 2 - 40 * rp, bw + 80 * rp, bh + 80 * rp, 58 + 40 * rp); ctx.strokeStyle = rgba(P.cream, 0.8 * (1 - rp)); ctx.lineWidth = 6; ctx.stroke(); }
    rr(ctx, -bw / 2, -bh / 2 + 10, bw, bh, 58); ctx.fillStyle = 'rgba(28,18,12,0.55)'; ctx.fill();
    rr(ctx, -bw / 2, -bh / 2, bw, bh, 58); ctx.fillStyle = P.accent; ctx.fill();
    let xr = bw / 2 - 50;
    words.forEach(([w_, ts], i) => { drawWordRTL(ctx, w_, xr, 0, sz, P.cream, seg(t, ts - 0.04, ts + 0.2)); xr -= ws[i] + sp; });
    // arrow icon (pointing up toward profile)
    const ay = -6 + Math.sin(t * TAU * 2) * 6;
    ctx.save(); ctx.translate(-bw / 2 + 62, ay);
    ctx.beginPath(); ctx.arc(0, 6, 34, 0, TAU); ctx.fillStyle = P.cream; ctx.fill();
    ctx.strokeStyle = P.accent; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, -10); ctx.moveTo(-13, 3); ctx.lineTo(0, -10); ctx.lineTo(13, 3); ctx.stroke();
    ctx.restore();
    ctx.restore();
  }
}

// ---------- grain + vignette ----------
const GRAIN = [];
(function makeGrain() {
  for (let k = 0; k < 4; k++) {
    const g = document.createElement('canvas'); g.width = 540; g.height = 960;
    const gc = g.getContext('2d'); const id = gc.createImageData(540, 960); const r = mulberry(100 + k);
    for (let p = 0; p < id.data.length; p += 4) { const v = r() < 0.5 ? 0 : 255; id.data[p] = id.data[p + 1] = id.data[p + 2] = v; id.data[p + 3] = Math.floor(r() * 26); }
    gc.putImageData(id, 0, 0); GRAIN.push(g);
  }
})();
function drawGrain(frame) {
  ctx.save(); ctx.globalAlpha = 0.55; ctx.imageSmoothingEnabled = false;
  ctx.drawImage(GRAIN[frame % 4], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.75);
  v.addColorStop(0, 'rgba(28,18,12,0)'); v.addColorStop(1, 'rgba(28,18,12,0.35)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- cells ----------
function drawCell(i, t) {
  const c0 = cells[i]; const lt = t - FILL[i];
  if (lt < 0) { drawEmpty(i, t); return; }
  let x = c0.x, y = c0.y, w = c0.w, h = c0.h, rad = 18;
  let sc = lerp(0.85, 1, eOutBack(seg(lt, 0, 0.42), 1.7));
  let alpha = seg(lt, 0, 0.1);
  if (i !== 5 && t > EXP0 - 0.4) {
    const ord = [0, 1, 2, 3, 4].indexOf(i);
    const k = seg(t, EXP0 + ord * 0.05, EXP0 + 0.4 + ord * 0.05);
    sc *= lerp(1, 0.6, eInCubic(k)); alpha *= 1 - eInCubic(k);
    if (alpha <= 0.001) return;
  }
  let glow = 0;
  if (i === 5) {
    const k = eInOutCubic(seg(t, EXP0, EXP1));
    x = lerp(c0.x, 0, k); y = lerp(c0.y, 0, k); w = lerp(c0.w, W, k); h = lerp(c0.h, H, k); rad = lerp(18, 0, k);
    glow = seg(t, 16.2, 16.6) * (1 - k);
  }
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(sc, sc); ctx.translate(-w / 2, -h / 2);
  ctx.globalAlpha = alpha;
  rr(ctx, 0, 9, w, h, rad); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.save();
  rr(ctx, 0, 0, w, h, rad); ctx.clip();
  ctx.fillStyle = CELL_BG[i]; ctx.fillRect(0, 0, w, h);
  SCENES[i](ctx, lt, w, h, t);
  // inner vignette
  const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(42,26,17,0)'); vg.addColorStop(1, 'rgba(42,26,17,0.22)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
  // dim others before hero expands
  if (i !== 5) { const d = seg(t, 16.2, 16.7) * 0.45; if (d > 0) { ctx.fillStyle = `rgba(28,18,12,${d})`; ctx.fillRect(0, 0, w, h); } }
  // entry flash
  const fl = 1 - seg(lt, 0, 0.28); if (fl > 0) { ctx.fillStyle = `rgba(255,246,232,${0.75 * fl * fl})`; ctx.fillRect(0, 0, w, h); }
  ctx.restore();
  if (glow > 0) { rr(ctx, -3, -3, w + 6, h + 6, rad + 3); ctx.strokeStyle = rgba(P.accent, glow * (0.7 + 0.3 * Math.sin(t * TAU * 4))); ctx.lineWidth = 8; ctx.stroke(); }
  ctx.restore();
}

// ---------- main ----------
function render(t, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = P.esp; ctx.fillRect(0, 0, W, H);
  // beat punch
  let punch = 0; FILL.forEach(f => { if (t >= f) punch += Math.exp(-(t - f) * 11) * 0.02; });
  if (t >= EXP0) punch += Math.exp(-(t - EXP0) * 8) * 0.015;
  const st = t > 8.02 && t < 8.3 ? Math.sin((t - 8.02) * 90) * 7 * (1 - seg(t, 8.02, 8.3)) : 0;
  ctx.save();
  ctx.translate(W / 2 + st, H / 2); ctx.scale(1 + punch, 1 + punch); ctx.translate(-W / 2, -H / 2);
  for (let i = 0; i < 5; i++) drawCell(i, t);
  drawCell(5, t);
  ctx.restore();
  drawHook(t);
  drawChips(t);
  drawCaption(t);
  drawCoins(t);
  drawCTA(t);
  drawGrain(frame);
}
window.render = render;
window.ready = document.fonts.load(font(60, 900), 'قهوة abc').then(() => document.fonts.load(font(60, 700), 'قهوة abc')).then(() => document.fonts.load(font(60, 500), 'قهوة abc')).then(() => document.fonts.ready).then(() => { PHRASES.forEach(p => p.m = phraseMetrics(p)); return true; });
</script>
