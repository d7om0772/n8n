<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Prebuilt vs custom PC</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#F4F3F8;--ink:#0E0E13;--pur:#7C3AED;--pur-l:#EDE4FF;--gray:#8B8999;--dark:#0B0B10}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:'Rubik',sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;display:none;transform-origin:50% 50%}
.bg-light{background-color:var(--bg);background-image:radial-gradient(circle,#DCD9E6 2.2px,transparent 2.7px);background-size:44px 44px;background-position:22px 22px}
.bg-dark{background:var(--dark)}
.line{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:baseline;gap:.26em;white-space:nowrap;direction:rtl;line-height:1.2}
.m{display:inline-block;overflow:hidden;padding:.2em .08em .24em;margin:-.2em -.08em -.24em}
.w{display:inline-block}
.ltr{direction:ltr;unicode-bidi:isolate}
.abs{position:absolute}
.ctr{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;line-height:1.2}
img.foot{position:absolute;display:block;object-fit:cover}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
const W = 1080, H = 1920, FPS = 30, TOTAL = 35.0;
const stage = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out2: p => 1 - (1 - p) * (1 - p),
  out3: p => 1 - Math.pow(1 - p, 3),
  out5: p => 1 - Math.pow(1 - p, 5),
  in3: p => p * p * p,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
const P = (t, t0, d, e = E.out3) => e(clamp((t - t0) / d));
function mk(tag, parent, css, html) {
  const e = document.createElement(tag);
  if (css) Object.assign(e.style, css);
  if (html !== undefined) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const st = (e, css) => Object.assign(e.style, css);
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ---------- footage (pre-extracted 30 fps JPEG sequences, see shots.sh) ---------- */
const SHOTS = {a_card:72,b_gpu:86,c_mobo:18,c_ram:18,c_fans:18,c_case:19,t_liquid:117,t_case:163,t_orange:162,d_ram:132,e_mobo:168,e_ram:168,g_fans:132};
const foots = [];
let building = null;
function foot(name, parent, css, t0) {
  const e = mk('img', parent, css);
  e.className = 'foot';
  foots.push({ e, name, t0, n: SHOTS[name], cur: -1, scene: building });
  return e;
}
const fidx = (f, n) => { if (f <= 0) return 0; const per = 2 * (n - 1), m = f % per; return m < n ? m : per - m; };

/* ---------- text helpers ---------- */
function line(parent, y, size, weight, color, words, extra) {
  const L = mk('div', parent, Object.assign({ top: y + 'px', fontSize: size + 'px', fontWeight: weight, color }, extra || {}));
  L.className = 'line';
  const ws = words.map(w => {
    if (typeof w === 'string') w = { h: w };
    const m = mk('span', L); m.className = 'm';
    const s = mk('span', m, w.css || {}, w.h); s.className = 'w' + (w.ltr ? ' ltr' : '');
    s.style.transform = 'translateY(120%)';
    return s;
  });
  return { el: L, ws };
}
const rise = (w, p) => { w.style.transform = `translateY(${(1 - p) * 120}%)`; };
function blurIn(e, p, s0 = 1.12) {
  e.style.filter = p >= 1 ? 'none' : `blur(${(1 - p) * 26}px)`;
  e.style.opacity = clamp(p * 1.5);
  e.style.transform = `scale(${lerp(s0, 1, p)})`;
}
function pop(e, p, base = '') { e.style.transform = `${base} scale(${Math.max(0, p)})`; e.style.opacity = clamp(p * 3); }
function riseWords(L, times, t, d = .38) { L.ws.forEach((w, i) => rise(w, P(t, times[i], d, E.out5))); }

/* ---------- icons ---------- */
const ICON = {
  search: c => `<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="27" cy="27" r="17" fill="none" stroke="${c}" stroke-width="7"/><line x1="40" y1="40" x2="56" y2="56" stroke="${c}" stroke-width="8" stroke-linecap="round"/></svg>`,
  warn: (c, s = 200) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M50 10 L92 86 L8 86 Z" fill="${c}" stroke="${c}" stroke-width="10" stroke-linejoin="round"/><rect x="45" y="34" width="10" height="30" rx="5" fill="#fff"/><circle cx="50" cy="74" r="6" fill="#fff"/></svg>`,
  doc: c => `<svg width="120" height="120" viewBox="0 0 100 100"><rect x="18" y="8" width="64" height="84" rx="10" fill="none" stroke="${c}" stroke-width="7"/><line x1="32" y1="32" x2="68" y2="32" stroke="${c}" stroke-width="7" stroke-linecap="round"/><line x1="32" y1="50" x2="68" y2="50" stroke="${c}" stroke-width="7" stroke-linecap="round"/><line x1="32" y1="68" x2="54" y2="68" stroke="${c}" stroke-width="7" stroke-linecap="round"/></svg>`,
  bubble: c => `<svg width="80" height="80" viewBox="0 0 100 100"><path d="M14 20 Q14 10 24 10 L76 10 Q86 10 86 20 L86 62 Q86 72 76 72 L44 72 L24 90 L26 72 L24 72 Q14 72 14 62 Z" fill="${c}"/><circle cx="34" cy="41" r="6" fill="#fff"/><circle cx="50" cy="41" r="6" fill="#fff"/><circle cx="66" cy="41" r="6" fill="#fff"/></svg>`,
  down: c => `<svg width="110" height="110" viewBox="0 0 100 100"><path d="M50 12 L50 80 M22 54 L50 84 L78 54" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  send: c => `<svg width="48" height="48" viewBox="0 0 100 100"><path d="M86 50 L16 18 L28 50 L16 82 Z" fill="${c}" transform="rotate(180 50 50)"/></svg>`,
};

/* ---------- word timings (Whisper on voiceover take1) ---------- */
// see timing.json; only the cue points used by the animation are listed here
const scenes = [];
function scene(def) {
  const root = mk('div', stage); root.className = 'scene ' + (def.bg || 'bg-light');
  def.root = root; building = def; def.build(root); building = null;
  scenes.push(def);
  return def;
}

/* ===== S1 0.00 hook: "ما كنت أحب التجميعات الجاهزة" ===== */
scene({ a: 0, b: 2.02,
  build(r) {
    this.l1 = mk('div', r, { top: '300px', fontSize: '88px', fontWeight: 700, color: 'var(--ink)' }, 'ما كنت أحب'); this.l1.className = 'ctr';
    this.l2 = line(r, 410, 156, 900, 'var(--ink)', ['التجميعات']);
    this.l3 = line(r, 590, 156, 900, 'var(--pur)', ['الجاهزة']);
    this.card = mk('div', r, { position: 'absolute', left: '100px', top: '870px', width: '880px', height: '660px', borderRadius: '44px', overflow: 'hidden', background: '#111', boxShadow: '0 30px 80px rgba(40,20,90,.28)' });
    foot('a_card', this.card, { left: 0, top: 0, width: '880px', height: '660px' }, 0.95);
    this.chip = mk('div', this.card, { position: 'absolute', right: '30px', bottom: '30px', background: 'rgba(255,255,255,.94)', color: 'var(--ink)', fontSize: '42px', padding: '16px 34px' }, 'تجميعة جاهزة');
    this.chip.className = 'pill';
  },
  update(t) {
    blurIn(this.l1, P(t, 0.0, 0.55, E.out3));
    rise(this.l2.ws[0], P(t, 0.80, 0.42, E.out5));
    rise(this.l3.ws[0], P(t, 1.30, 0.42, E.out5));
    const c = P(t, 1.0, 0.6, E.out5), ins = (1 - c) * 50;
    st(this.card, { clipPath: `inset(${ins}% ${ins}% ${ins}% ${ins}% round 44px)`, transform: `scale(${lerp(.82, 1, c)}) rotate(${lerp(-5, 0, c)}deg)` });
    pop(this.chip, P(t, 1.45, .4, E.back));
  } });

/* ===== S2 2.02 "بس مع غلاء القطع" (light -> bold + chart) ===== */
scene({ a: 2.02, b: 3.26, trans: 'slide',
  build(r) {
    this.l1 = line(r, 330, 84, 600, 'var(--gray)', ['بس', 'مع']);
    this.big = mk('div', r, { top: '450px', fontSize: '184px', fontWeight: 300, color: 'var(--ink)' }, 'غلاء القطع'); this.big.className = 'ctr';
    const pts = [[40, 520], [170, 470], [290, 495], [420, 380], [545, 405], [675, 245], [800, 110]];
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    this.len = len;
    const d = 'M' + pts.map(p => p.join(' ')).join(' L');
    const ang = Math.atan2(pts[6][1] - pts[5][1], pts[6][0] - pts[5][0]) * 180 / Math.PI;
    this.svg = mk('div', r, { position: 'absolute', left: '100px', top: '870px', width: '880px', height: '600px', direction: 'ltr' },
      `<svg width="880" height="600" viewBox="0 0 880 600">
        <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient></defs>
        ${[150, 280, 410, 540].map(y => `<line x1="20" y1="${y}" x2="860" y2="${y}" stroke="#DAD7E4" stroke-width="3" stroke-dasharray="10 12"/>`).join('')}
        <path id="area" d="${d} L800 560 L40 560 Z" fill="url(#ga)" opacity="0"/>
        <path id="ln" d="${d}" fill="none" stroke="#7C3AED" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${len}" stroke-dashoffset="${len}"/>
        <g id="hd" transform="translate(800 110) rotate(${ang}) scale(0)"><path d="M-6 -30 L34 0 L-6 30 Z" fill="#7C3AED" stroke="#7C3AED" stroke-width="8" stroke-linejoin="round"/></g>
      </svg>`);
    this.ln = this.svg.querySelector('#ln'); this.area = this.svg.querySelector('#area'); this.hd = this.svg.querySelector('#hd'); this.ang = ang;
    this.tag = mk('div', r, { position: 'absolute', right: '120px', top: '850px', background: 'var(--pur)', color: '#fff', fontSize: '44px', padding: '14px 32px' }, 'الأسعار ↑');
    this.tag.className = 'pill';
  },
  update(t) {
    riseWords(this.l1, [2.04, 2.22], t);
    const wp = P(t, 2.30, .62, E.io3);
    st(this.big, { fontWeight: Math.round(lerp(300, 900, wp)), opacity: P(t, 2.24, .18), transform: `scale(${lerp(.94, 1, P(t, 2.24, .5))})` });
    const lp = P(t, 2.30, .85, E.io3);
    this.ln.setAttribute('stroke-dashoffset', this.len * (1 - lp));
    this.area.setAttribute('opacity', P(t, 2.7, .4));
    const hp = P(t, 3.02, .25, E.back);
    this.hd.setAttribute('transform', `translate(800 110) rotate(${this.ang}) scale(${Math.max(0, hp)})`);
    pop(this.tag, P(t, 2.80, .35, E.back));
  } });

/* ===== S3 3.26 "صارت خيار  غلط -> أذكى" (word swap + highlight) ===== */
scene({ a: 3.26, b: 4.98, trans: 'slide',
  build(r) {
    this.l1 = line(r, 560, 140, 800, 'var(--ink)', ['صارت', 'خيار']);
    this.hl = mk('div', r, { position: 'absolute', left: '230px', width: '620px', top: '850px', height: '250px', background: 'var(--pur)', borderRadius: '40px', transformOrigin: '100% 50%', transform: 'scaleX(0)' });
    this.slot = mk('div', r, { position: 'absolute', left: '0', width: '1080px', top: '820px', height: '310px', overflow: 'hidden' });
    this.w1 = mk('div', this.slot, { top: '0', fontSize: '200px', fontWeight: 900, color: '#B5B2C3' }, 'غلط'); this.w1.className = 'ctr';
    this.strike = mk('div', this.slot, { position: 'absolute', left: '340px', width: '400px', top: '150px', height: '16px', borderRadius: '8px', background: 'var(--ink)', transformOrigin: '100% 50%', transform: 'scaleX(0)' });
    this.w2 = mk('div', this.slot, { top: '0', fontSize: '200px', fontWeight: 900, color: '#fff' }, 'أذكى'); this.w2.className = 'ctr';
    this.sp = [-78, -48, -18].map(a => mk('div', r, { position: 'absolute', width: '14px', height: '58px', borderRadius: '7px', background: 'var(--pur)', left: '208px', top: '742px', transformOrigin: '50% calc(100% + 34px)', transform: `rotate(${a}deg) scaleY(0)` }));
    this.spa = [-78, -48, -18];
    this.sub = mk('div', r, { top: '1190px', fontSize: '54px', fontWeight: 600, color: 'var(--gray)' }, 'بدل ما تجمّع قطعة قطعة'); this.sub.className = 'ctr';
  },
  update(t) {
    riseWords(this.l1, [3.28, 3.60], t);
    const a = P(t, 3.62, .25, E.out5), sw = P(t, 3.98, .3, E.out5);
    st(this.w1, { transform: `translateY(${(1 - a) * 100 - sw * 110}%)` });
    st(this.w2, { transform: `translateY(${(1 - sw) * 110}%)` });
    this.strike.style.transform = `scaleX(${P(t, 3.74, .2, E.out3) * (1 - sw)})`;
    this.hl.style.transform = `scaleX(${P(t, 3.98, .3, E.out5)})`;
    const sp = P(t, 4.22, .35, E.back);
    this.sp.forEach((s, i) => st(s, { transform: `rotate(${this.spa[i]}deg) translateY(${-14 * sp}px) scaleY(${Math.max(0, sp)})`, opacity: clamp(sp * 2) }));
    st(this.sub, { opacity: P(t, 4.35, .3) * 1 });
  } });

/* ===== S4 4.98 GPU footage: "جمّعت جهاز بكرت RTX 5060" (card reveal + outline->fill) ===== */
scene({ a: 4.98, b: 7.52, trans: 'reveal', d: .42, bg: 'bg-dark',
  build(r) {
    this.img = foot('b_gpu', r, { left: 0, top: 0, width: '1080px', height: '1920px' }, 4.98);
    mk('div', r, { position: 'absolute', inset: 0, background: 'linear-gradient(180deg,rgba(8,6,16,.75) 0%,rgba(8,6,16,.1) 26%,rgba(8,6,16,0) 58%,rgba(8,6,16,.82) 100%)' });
    this.l1 = line(r, 250, 112, 800, '#fff', ['جمّعت', 'جهاز']);
    this.chip = mk('div', r, { position: 'absolute', left: '440px', width: '200px', top: '1215px', height: '84px', background: '#fff', color: 'var(--pur)', fontSize: '46px' }, 'بكرت'); this.chip.className = 'pill';
    this.rtx = mk('div', r, { top: '1310px', fontSize: '168px', fontWeight: 900, color: 'rgba(255,255,255,0)', webkitTextStroke: '5px #fff', direction: 'ltr' }, 'RTX 5060'); this.rtx.className = 'ctr';
  },
  update(t) {
    this.img.style.transform = `scale(${lerp(1.0, 1.07, clamp((t - 4.98) / 2.6))})`;
    riseWords(this.l1, [5.10, 5.40], t);
    pop(this.chip, P(t, 5.70, .35, E.back));
    const o = P(t, 6.12, .48, E.io3), f = P(t, 6.62, .28, E.out3);
    st(this.rtx, { clipPath: `inset(-20% ${(1 - o) * 100}% -20% -5%)`, color: `rgba(255,255,255,${f})`,
      textShadow: f > 0 ? `0 0 ${40 * f}px rgba(124,58,237,${.9 * f}), 0 8px 30px rgba(0,0,0,.5)` : 'none',
      transform: `scale(${1 + .06 * Math.sin(Math.PI * P(t, 6.62, .3, E.lin))})` });
  } });

/* ===== S5 7.52 "قطعة قطعة" montage ===== */
scene({ a: 7.52, b: 8.90, trans: 'cut', bg: 'bg-dark',
  build(r) {
    this.cuts = [['c_mobo', 7.52, 'اللوحة'], ['c_ram', 7.86, 'الرامات'], ['c_fans', 8.20, 'التبريد'], ['c_case', 8.54, 'الكيس']].map(([n, t0, label]) => ({ img: foot(n, r, { left: 0, top: 0, width: '1080px', height: '1920px' }, t0), t0, label }));
    mk('div', r, { position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 50% 50%,rgba(8,6,16,.25) 0%,rgba(8,6,16,.7) 100%)' });
    this.q1 = mk('div', r, { top: '640px', fontSize: '220px', fontWeight: 900, color: '#fff', textShadow: '0 10px 40px rgba(0,0,0,.5)' }, 'قطعة'); this.q1.className = 'ctr';
    this.q2 = mk('div', r, { top: '900px', fontSize: '220px', fontWeight: 900, color: 'rgba(255,255,255,0)', webkitTextStroke: '5px #fff' }, 'قطعة'); this.q2.className = 'ctr';
    this.row = mk('div', r, { position: 'absolute', left: '90px', width: '900px', top: '1270px', display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: '18px', direction: 'rtl' });
    this.chips = this.cuts.map(c => { const e = mk('div', this.row, { background: 'rgba(255,255,255,.95)', color: 'var(--ink)', fontSize: '44px', padding: '16px 34px' }, c.label); e.className = 'pill'; return e; });
    this.flash = mk('div', r, { position: 'absolute', inset: 0, background: '#fff', opacity: 0 });
  },
  update(t) {
    let k = 0; this.cuts.forEach((c, i) => { if (t >= c.t0) k = i; });
    this.cuts.forEach((c, i) => st(c.img, { display: i === k ? 'block' : 'none', transform: `scale(${lerp(1.14, 1.0, P(t, c.t0, .34, E.out3))})` }));
    this.flash.style.opacity = .3 * (1 - P(t, this.cuts[k].t0, .12, E.lin));
    pop(this.q1, P(t, 7.56, .3, E.back));
    pop(this.q2, P(t, 8.14, .3, E.back));
    this.q2.style.color = `rgba(124,58,237,${P(t, 8.30, .25)})`;
    this.chips.forEach((c, i) => pop(c, P(t, this.cuts[i].t0 + .04, .3, E.back)));
  } });

/* ===== S6 8.90 "وطلع معي ستة آلاف ريال" (counter) ===== */
scene({ a: 8.90, b: 11.38, trans: 'slide',
  build(r) {
    this.chip = mk('div', r, { position: 'absolute', left: '340px', width: '400px', top: '470px', height: '88px', border: '4px solid var(--pur)', color: 'var(--pur)', fontSize: '42px', background: 'var(--pur-l)' }, 'تجميع ذاتي'); this.chip.className = 'pill';
    this.l1 = line(r, 590, 96, 700, 'var(--ink)', ['وطلع', 'معي']);
    this.num = mk('div', r, { top: '760px', fontSize: '300px', fontWeight: 900, color: 'var(--ink)', direction: 'ltr', letterSpacing: '-6px' }, '0'); this.num.className = 'ctr';
    this.bar = mk('div', r, { position: 'absolute', left: '200px', width: '680px', top: '1130px', height: '18px', borderRadius: '9px', background: 'var(--pur)', transformOrigin: '50% 50%', transform: 'scaleX(0)' });
    this.cur = mk('div', r, { top: '1180px', fontSize: '160px', fontWeight: 800, color: 'var(--pur)' }, 'ريال'); this.cur.className = 'ctr';
  },
  update(t) {
    pop(this.chip, P(t, 8.96, .35, E.back));
    riseWords(this.l1, [8.96, 9.24], t);
    const c = P(t, 9.62, .62, E.out2);
    this.num.textContent = fmt(c >= 1 ? 6000 : Math.round(6000 * c / 50) * 50);
    st(this.num, { opacity: P(t, 9.55, .12), transform: `scale(${1 + .07 * Math.sin(Math.PI * P(t, 10.24, .25, E.lin))})` });
    this.bar.style.transform = `scaleX(${P(t, 10.20, .35, E.out5)})`;
    pop(this.cur, P(t, 10.38, .35, E.back));
  } });

/* ===== S7 11.38 search (typing) + result cards (rise, highlight, price pop) ===== */
scene({ a: 11.38, b: 16.58, trans: 'slide',
  build(r) {
    this.l1 = line(r, 210, 64, 600, 'var(--gray)', ['بعدها', 'دوّرت', 'في']);
    this.l2 = line(r, 300, 116, 900, 'var(--ink)', ['أمازون', { h: 'السعودية', css: { color: 'var(--pur)' } }]);
    this.bar = mk('div', r, { position: 'absolute', left: '100px', width: '880px', top: '520px', height: '136px', borderRadius: '68px', background: '#fff', border: '5px solid var(--ink)', boxShadow: '0 18px 50px rgba(40,20,90,.14)' });
    this.ic = mk('div', this.bar, { position: 'absolute', left: '34px', top: '31px', width: '64px', height: '64px' }, ICON.search('#0E0E13'));
    this.txt = mk('div', this.bar, { position: 'absolute', right: '46px', top: '26px', fontSize: '58px', fontWeight: 600, color: 'var(--ink)', whiteSpace: 'nowrap', direction: 'rtl', display: 'flex', alignItems: 'center' });
    this.typed = mk('span', this.txt); this.caret = mk('span', this.txt, { display: 'inline-block', width: '6px', height: '66px', background: 'var(--pur)', marginRight: '6px', borderRadius: '3px' });
    const thumbs = ['t_liquid', 't_case', 't_orange'];
    this.cards = thumbs.map((n, i) => {
      const c = mk('div', r, { position: 'absolute', left: '100px', width: '880px', top: `${720 + i * 250}px`, height: '226px', borderRadius: '34px', background: '#fff', boxShadow: '0 16px 44px rgba(40,20,90,.12)', overflow: 'hidden' });
      const th = mk('div', c, { position: 'absolute', right: '16px', top: '16px', width: '262px', height: '194px', borderRadius: '24px', overflow: 'hidden', background: '#222' });
      foot(n, th, { left: 0, top: 0, width: '262px', height: '194px' }, 13.0);

/* ---------- flash overlay for cuts ---------- */
const flash = mk('div', stage, { position: 'absolute', inset: 0, background: '#fff', opacity: 0, zIndex: 999, pointerEvents: 'none' });

/* ---------- master render ---------- */
async function render(t) {
  let fl = 0;
  for (let i = 0; i < scenes.length; i++) {
    const s = scenes[i], nx = scenes[i + 1];
    const nd = nx ? (nx.d || .28) : 0;
    let vis = t >= s.a && t < s.b, outP = -1;
    if (nx && t >= s.b && t < s.b + nd && nx.trans !== 'cut') { vis = true; outP = (t - s.b) / nd; }
    s.root.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    s.update(t);
    let tf = 'none', op = 1, filt = 'none', clip = 'none';
    const din = s.d || .28;
    if (outP >= 0) {
      const p = E.io3(clamp(outP));
      if (nx.trans === 'slide') { tf = `translateY(${-p * 560}px) scale(${1 - p * .08})`; filt = `brightness(${1 - p * .45})`; }
      else if (nx.trans === 'zoom') { tf = `scale(${1 + p * .3})`; op = 1 - p; }
    } else if (i > 0 && t - s.a < din) {
      const p = clamp((t - s.a) / din);
      if (s.trans === 'slide') { tf = `translateY(${(1 - E.out5(p)) * 1920}px)`; }
      else if (s.trans === 'zoom') { const e = E.out3(p); tf = `scale(${lerp(1.4, 1, e)})`; op = e; filt = `blur(${(1 - e) * 16}px)`; }
      else if (s.trans === 'reveal') { const e = E.io3(p); clip = `inset(${lerp(34, 0, e)}% ${lerp(24, 0, e)}% ${lerp(34, 0, e)}% ${lerp(24, 0, e)}% round ${lerp(60, 0, e)}px)`; }
      else if (s.trans === 'cut') { tf = `scale(${lerp(1.1, 1, E.out3(p))})`; if (s.flash !== false) fl = Math.max(fl, .38 * (1 - p)); }
    }
    st(s.root, { transform: tf, opacity: op, filter: filt, clipPath: clip, zIndex: i + 1 });
  }
  flash.style.opacity = fl;
  const proms = [];
  for (const f of foots) {
    if (f.scene.root.style.display === 'none') continue;
    const fr = fidx(Math.floor((t - f.t0) * FPS + 1e-6), f.n);
    if (fr !== f.cur) { f.cur = fr; f.e.src = `shots/${f.name}/${String(fr).padStart(4, '0')}.jpg`; proms.push(f.e.decode().catch(() => {})); }
  }
  await Promise.all(proms);
}
window.render = render;
window.TOTAL = TOTAL;
